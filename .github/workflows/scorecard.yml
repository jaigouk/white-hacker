# OpenSSF Scorecard — scores THIS repo's own supply-chain security posture (branch protection,
# pinned deps, token permissions, dangerous workflows, …) and publishes a public score + badge.
# On-brand: white-hacker is itself a supply-chain-security tool (ADR-024..027), so we dogfood it.
# Badge (add to README after the first successful run):
#   https://api.securityscorecards.dev/projects/github.com/jaigouk/white-hacker/badge
# ADR-006: third-party Actions pinned to a commit SHA + a version comment.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "31 4 * * 1" # weekly — Monday 04:31 UTC
  push:
    branches: [main]

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF results to code scanning
      id-token: write # publish results to the OpenSSF API (required for the badge)
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2 (SHA resolved 2026-06-13)
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.3 (SHA verified 2026-06-06)
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.3 (SHA resolved 2026-06-13)
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true # required for the badge + the public Scorecard API

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4 (SHA resolved 2026-06-13)
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v3 (SHA resolved 2026-06-13)
        with:
          sarif_file: results.sarif
